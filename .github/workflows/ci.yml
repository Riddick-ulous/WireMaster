name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Upload router V3 SVG diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: router-v3-diagnostics
          path: artifacts/router-v3/*.svg
          if-no-files-found: warn

  tauri-build:
    needs: web-core
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - run: npm ci
      - name: Build Tauri desktop app
        run: npm run tauri build -- --no-bundle
      - name: Emit resolved Cargo lock snapshot
        if: always()
        run: |
          echo CARGO_LOCK_GZIP_BASE64_BEGIN
          gzip -c src-tauri/Cargo.lock | base64 -w0
          echo
          echo CARGO_LOCK_GZIP_BASE64_END

  tauri-windows-build:
    needs: web-core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm.cmd ci
      - name: Build Tauri desktop app on Windows
        run: npm.cmd run tauri build -- --no-bundle
