[package]
name = "wiremaster"
version = "0.1.0"
description = "WireMaster harness engineering tool"
authors = ["WireMaster contributors"]
edition = "2021"

[lib]
name = "wiremaster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17.2"
